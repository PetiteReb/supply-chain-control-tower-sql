services:
  db:
    image: postgres:16-alpine
    container_name: control_tower_db
    environment:
      POSTGRES_DB: control_tower
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
    ports:
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d control_tower"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: